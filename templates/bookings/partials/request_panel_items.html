{% if bookings %}
  <div class="booking-rows">
    {% for booking in bookings %}
      {% include "bookings/partials/booking_row.html" %}
    {% endfor %}
  </div>
  <a class="text-link panel-link" href="{% url 'bookings:booking_list' %}">See all requests <span aria-hidden="true">&rarr;</span></a>
{% else %}
  <p class="muted">No requests yet. When you request care from a caregiver, it'll show up here.</p>
{% endif %}
